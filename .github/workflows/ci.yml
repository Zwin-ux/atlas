name: Atlas CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, build, tests, and contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      ATLAS_COMMONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:core
      - run: pnpm test:hosted-clawd
      - run: pnpm test:hosted-clawd-billing
      - run: pnpm test:hosted-clawd-protected-tool-gate
      - run: pnpm test:hosted-clawd-saved-read-surface
      - run: pnpm test:atlas-commons
      - run: pnpm verify:atlas-commons
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

  postgres-smoke:
    name: Additive migration and Postgres smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate:hosted-clawd
      - run: pnpm smoke:atlas-commons:postgres
