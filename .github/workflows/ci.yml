name: Atlas CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, build, tests, and contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      ATLAS_COMMONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:core

      # Gates for the surface that actually ships. Both run offline.
      # Location Truth is the product's non-negotiable quality bar: a location
      # query resolves correctly or refuses honestly, never confidently wrong.
      # It was never wired into CI, which is how a red gate reached release week.
      - name: Location Truth gate
        run: pnpm verify:location-truth
      - name: Tool-surface drift gate
        run: node scripts/verify-atlas-source-of-truth-drift.mjs
      - name: Document authority drift gate
        run: pnpm brain:verify
      - name: Public HTTP surface gate
        run: pnpm verify:public-http
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
