<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas Dense Voxel Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="lab-shell">
      <canvas id="voxel-canvas" aria-label="Pastel voxel dense comparison candidate render lab"></canvas>

      <section class="lab-panel" aria-label="Voxel render controls">
        <div>
          <p class="eyebrow">Atlas Lab</p>
          <h1>Dense Candidate</h1>
        </div>

        <div class="control-row" aria-label="Scene presets">
          <button type="button" data-scene="dense" class="is-active">Dense</button>
          <button type="button" data-scene="straight">Straight</button>
          <button type="button" data-scene="cross">Cross</button>
          <button type="button" data-scene="lots">Lots</button>
        </div>

        <label>
          Detail
          <input id="detail-slider" type="range" min="0" max="2" step="1" value="2" />
        </label>

        <label>
          Light
          <input id="light-slider" type="range" min="0" max="100" step="1" value="72" />
        </label>

        <label>
          Camera
          <input id="camera-slider" type="range" min="84" max="148" step="1" value="118" />
        </label>
      </section>
    </main>

    <script defer src="./authored-modules.js"></script>
    <script defer src="./pastel-voxel-lab.js"></script>
  </body>
</html>
